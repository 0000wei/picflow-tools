    <script>
    function switchLanguage(code) {
        var paths = {"en": "https://picete.com/", "zh": "https://picete.com/zh/", "ja": "https://picete.com/ja/", "de": "https://picete.com/de/", "fr": "https://picete.com/fr/", "es": "https://picete.com/es/", "pt": "https://picete.com/pt/", "ar": "https://picete.com/ar/"};
        // Get current page path from URL
        var path = window.location.pathname;
        
        // Remove language prefix if present
        var cleanPath = path.replace(/^\/(zh|ja|de|fr|es|pt|ar)\//, '/');
        if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
        
        // Build target URL
        var baseUrl = paths[code];
        var targetPath = cleanPath;
        
        // For homepage (index.html or trailing slash)
        if (targetPath === '/' || targetPath === '/index.html') {
            window.location.href = baseUrl;
        } else {
            // Remove leading slash before appending to base URL
            window.location.href = baseUrl.replace(/\/$/, '') + targetPath;
        }
    }
    </script>

    <script>
        const state={uploadedFiles:[],resizedImages:[]},uploadArea=document.getElementById('uploadArea'),fileInput=document.getElementById('fileInput'),selectBtn=document.getElementById('selectBtn'),processingArea=document.getElementById('processingArea'),previewGrid=document.getElementById('previewGrid'),downloadSection=document.getElementById('downloadSection'),downloadGrid=document.getElementById('downloadGrid'),resizeBtn=document.getElementById('resizeBtn'),resetBtn=document.getElementById('resetBtn'),downloadAllBtn=document.getElementById('downloadAllBtn'),startOverBtn=document.getElementById('startOverBtn');
        selectBtn.addEventListener('click',()=>fileInput.click());
        fileInput.addEventListener('change',e=>handleFiles(Array.from(e.target.files)));
        uploadArea.addEventListener('dragover',e=>{e.preventDefault();uploadArea.classList.add('dragover')});
        uploadArea.addEventListener('dragleave',()=>uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop',e=>{e.preventDefault();uploadArea.classList.remove('dragover');handleFiles(Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')))});
        resizeBtn.addEventListener('click',resizeImages);
        resetBtn.addEventListener('click',reset);
        downloadAllBtn.addEventListener('click',downloadAll);
        startOverBtn.addEventListener('click',reset);
        function handleFiles(files){if(0===files.length)return alert('الرجاء اختيار الصور');state.uploadedFiles=files;Promise.all(files.map(f=>loadImage(f))).then(images=>{displayPreviews(images);uploadArea.style.display='none';processingArea.style.display='block'}).catch(()=>alert('فشل في تحميل الصور'))}
        function loadImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader;reader.onload=e=>{const img=new Image;img.onload=()=>resolve({img,file,src:e.target.result});img.src=e.target.result};reader.readAsDataURL(file)})}
        function displayPreviews(images){previewGrid.innerHTML=images.map(({img,file,src})=>`<div class="preview-item"><img src="${src}" alt="${file.name}"><div class="file-info"><strong>${file.name}</strong><br>${img.width} × ${img.height}px</div></div>`).join('')}
        function resizeImages(){const targetWidth=1080,targetHeight=1080;state.resizedImages=[];let processed=0;state.uploadedFiles.forEach((file,i)=>{loadImage(file).then(({img})=>{const canvas=document.createElement('canvas');canvas.width=targetWidth;canvas.height=targetHeight;const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,targetWidth,targetHeight);canvas.toBlob(blob=>{const url=URL.createObjectURL(blob);state.resizedImages[i]={url,name:file.name,size:blob.size,width:targetWidth,height:targetHeight};if(++processed===state.uploadedFiles.length)displayDownloads()},file.type)})})}
        function displayDownloads(){processingArea.style.display='none';downloadSection.style.display='block';downloadGrid.innerHTML=state.resizedImages.map((img,i)=>`<div class="download-item"><img src="${img.url}" alt="${img.name}"><h4>${img.name}</h4><p>${img.width} × ${img.height}px (${(img.size/1024).toFixed(1)} KB)</p><button class="btn-primary" onclick="downloadOne(${i})">تنزيل</button></div>`).join('')}
        window.downloadOne=function(i){const a=document.createElement('a');a.href=state.resizedImages[i].url;a.download=state.resizedImages[i].name;a.click()};
        function downloadAll(){state.resizedImages.forEach((img,i)=>setTimeout(()=>window.downloadOne(i),500*i))}
        function reset(){state.uploadedFiles=[];state.resizedImages=[];fileInput.value='';processingArea.style.display='none';downloadSection.style.display='none';uploadArea.style.display='block'}
    </script>
<script>
// Theme Toggle
(function(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    var t = localStorage.getItem('picete_theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
    else if(window.matchMedia('(prefers-color-scheme: dark)').matches){
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('picete_theme', 'dark');
    }
    btn.onclick = function(){
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('picete_theme', next || 'light');
    };
})();
</script>
