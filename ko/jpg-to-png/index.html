        function displayPreviews(images) {
            previewGrid.innerHTML = images.map(({ img, file, src }) => `
                <div class="preview-item">
                    <img src="${src}" alt="${file.name}">
                    <div class="file-info">
                        <strong>${file.name}</strong><br>${img.width} × ${img.height}px
                    </div>
                </div>
            `).join('');
        }

        function convertImages() {
            state.convertedImages = [];
            let processed = 0;

            state.uploadedFiles.forEach((file, i) => {
                loadImage(file).then(({ img }) => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0);

                    canvas.toBlob(blob => {
                        const url = URL.createObjectURL(blob);
                        state.convertedImages[i] = {
                            url,
                            name: file.name.replace(/\.(jpg|jpeg)$/i, '.png'),
                            size: blob.size
                        };
                        if (++processed === state.uploadedFiles.length) displayDownloads();
                    }, 'image/png');
                });
            });
        }

        function displayDownloads() {
            processingArea.style.display = 'none';
            downloadSection.style.display = 'block';
            downloadGrid.innerHTML = state.convertedImages.map((img, i) => `
                <div class="download-item">
                    <img src="${img.url}" alt="${img.name}">
                    <h4>${img.name}</h4>
                    <p>${(img.size / 1024).toFixed(1)} KB</p>
                    <button class="btn-primary" onclick="downloadOne(${i})">Download</button>
                </div>
            `).join('');
        }

        window.downloadOne = function(i) {
            const a = document.createElement('a');
            a.href = state.convertedImages[i].url;
            a.download = state.convertedImages[i].name;
            a.click();
        };

        function downloadAll() {
            state.convertedImages.forEach((img, i) => setTimeout(() => window.downloadOne(i), i * 500));
        }

        function reset() {
            state.uploadedFiles = [];
            state.convertedImages = [];
            fileInput.value = '';
            processingArea.style.display = 'none';
            downloadSection.style.display = 'none';
            uploadArea.style.display = 'block';
        }
    </script>

// Theme Toggle
(function(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    var t = localStorage.getItem('picete_theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
    else if(window.matchMedia('(prefers-color-scheme: dark)').matches){
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('picete_theme', 'dark');
    }
    btn.onclick = function(){
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('picete_theme', next || 'light');
    };
})();
</script>
