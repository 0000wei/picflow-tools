            "acceptedAnswer": {
                "@type": "Answer",
                "text": "AVIF(AV1 Image File Format)는 AV1 압축 기술을 사용하는 차세대 이미지 형식입니다. 동일한 품질 수준에서 JPG보다 최대 50% 더 작은 이미지를 생성할 수 있으며 HDR 및 넓은 색 영역과 같은 최신 기능을 지원합니다. 동일한 시각적 품질의 경우 AVIF 파일은 일반적으로 JPG보다 30-50% 더 작으므로 최신 웹 성능을 위한 이상적인 형식입니다."
            }
        },
        {
            "@type": "Question",
            "name": "JPG를 AVIF로 변환하면 품질이 손실되나요?",
            "acceptedAnswer": {
                "@type": "Answer",
                "text": "AVIF는 손실 압축을 사용하므로 약간의 품질 손실이 있습니다. 그러나 높은 품질 설정(80 이상)에서는 사진을 포함한 대부분의 이미지에서 눈으로 차이를 구별할 수 없습니다. AVIF의 AV1 코덱은 JPEG보다 훨씬 효율적이므로 비슷한 품질에서 더 작은 파일을 얻을 수 있습니다. 웹용의 경우 최대 압축에서 80-85의 품질을 사용하면 JPG 파일 크기의 절반으로 멋진 결과를 얻을 수 있습니다."
            }
        },
        {
            "@type": "Question",
            "name": "어떤 브라우저에서 AVIF를 지원하나요?",

                "text": "AVIF는 Chrome 85 이상, Firefox 93 이상, Safari 16.4 이상 및 Edge 및 Opera와 같은 모든 Chromium 기반 브라우저에서 지원됩니다. 이 형식은 또한 대부분의 주요 이미지 편집 도구 및 운영 체제에서 지원됩니다. 최신 브라우저 지원 정보는 caniuse.com에서 확인하세요."

                <div class="download-item">
                    <img src="${img.url}" alt="${img.name}">
                    <h4>${img.name}</h4>
                    <p>AVIF: ${(img.size / 1024).toFixed(1)} KB (was ${(img.originalSize / 1024).toFixed(1)} KB)</p>
                    <button class="btn-primary" onclick="downloadOne(${i})">Download</button>
                </div>
            `).join('');
        }

        window.downloadOne = function(i) {
            if (!state.convertedImages[i]) return;
            const a = document.createElement('a');
            a.href = state.convertedImages[i].url;
            a.download = state.convertedImages[i].name;
            a.click();
        };

        function downloadAll() {
            state.convertedImages.forEach((img, i) => setTimeout(() => window.downloadOne(i), i * 500));
        }

        function reset() {
            state.convertedImages.forEach(function(img) {
                if (img && img.url) URL.revokeObjectURL(img.url);
            });
            state.uploadedFiles = [];
            state.convertedImages = [];
            fileInput.value = '';
            qualitySlider.value = 80;
            qualityValue.textContent = '80';
            window.currentSpeed = 6;
            window.currentPreset = 'fast';
            document.querySelectorAll('.preset-btn').forEach(function(btn) {
                btn.classList.remove('active');
            });
            var fastBtn = document.querySelector('.preset-btn[data-speed="6"]');
            if (fastBtn) fastBtn.classList.add('active');
            processingArea.style.display = 'none';
            downloadSection.style.display = 'none';
            uploadArea.style.display = 'block';

<script>
// Theme Toggle
(function(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    var t = localStorage.getItem('picete_theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
    else if(window.matchMedia('(prefers-color-scheme: dark)').matches){
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('picete_theme', 'dark');
    }
    btn.onclick = function(){
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('picete_theme', next || 'light');
    };
})();
</script>
