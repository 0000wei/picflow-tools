                const swatchWidth = 100;
                const swatchHeight = 80;
                canvas.width = swatchWidth * palette.length;
                canvas.height = swatchHeight;

                palette.forEach((color, i) => {
                    ctx.fillStyle = color.hex;
                    ctx.fillRect(i * swatchWidth, 0, swatchWidth, swatchHeight);

                    // Add hex text
                    ctx.fillStyle = getContrastColor(color.r, color.g, color.b);
                    ctx.font = 'bold 14px monospace';
                    ctx.textAlign = 'center';
                    ctx.fillText(color.hex, i * swatchWidth + swatchWidth / 2, swatchHeight / 2 + 5);
                });

                canvas.toBlob(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'palette.png';
                    a.click();
                    URL.revokeObjectURL(url);
                });
            }
        }

        function getContrastColor(r, g, b) {
            // Calculate luminance
            const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
            return luminance > 0.5 ? '#000000' : '#FFFFFF';
        }

        function resetAll() {
            state.image = null;
            state.palette = [];
            fileInput.value = '';
            resultsSection.style.display = 'none';
            processingArea.style.display = 'none';
            uploadArea.style.display = 'block';
            colorCountSlider.value = 8;
            colorCountValue.textContent = '8';

<script>
// Theme Toggle
(function(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    var t = localStorage.getItem('picete_theme');
    if(t) document.documentElement.setAttribute('data-theme', t);
    else if(window.matchMedia('(prefers-color-scheme: dark)').matches){
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('picete_theme', 'dark');
    }
    btn.onclick = function(){
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('picete_theme', next || 'light');
    };
})();
</script>
